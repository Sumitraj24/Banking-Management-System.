

<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .main {
            padding: 22px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1a7a7a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #1a7a7a;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>👤 Employee Profile</h2>
    <a href="/home"><button style="width:auto;padding:6px 12px;">Back</button></a>
</div>

<div class="main">

    <!-- Change Password -->
    <div class="card">
        <h3>Change Password</h3>
        <form method="POST" action="/change_password">
            <input type="password" name="old_password" placeholder="Old Password" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <button type="submit">Update Password</button>
        </form>
    </div>

    <!-- Change MPIN -->
    <div class="card">
        <h3>Change MPIN</h3>
        <form method="POST" action="/change_mpin">
            <input type="password" name="old_mpin" placeholder="Old MPIN" required>
            <input type="password" name="new_mpin" placeholder="New MPIN" required>
            <button type="submit">Update MPIN</button>
        </form>
    </div>

</div>

</body>
</html>
