<!DOCTYPE html>
<html>
<head>
    <title>Loan Management</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 20px;
        }

        h2 {
            color: #1a7a7a;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1a7a7a;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }

        .approved {
            color: green;
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            background: #1a7a7a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Loan Management</h2>
    <a href="/home"><button class="btn">Back</button></a>
</div>

<div class="container">

    <h2>Loan Applications</h2>

    <table>
        <tr>
            <th>Loan ID</th>
            <th>Customer ID</th>
            <th>Amount</th>
            <th>Interest</th>
            <th>Duration</th>
            <th>Status</th>
        </tr>

        {% for l in loans %}
        <tr>
            <td>{{ l.loan_id }}</td>
            <td>{{ l.customer_id }}</td>
            <td>₹{{ l.amount }}</td>
            <td>{{ l.interest_rate }}%</td>
            <td>{{ l.duration }} months</td>
            <td class="{% if l.status == 'pending' %}pending{% else %}approved{% endif %}">
                {{ l.status }}
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
