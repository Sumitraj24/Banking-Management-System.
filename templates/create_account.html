<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <style>
        body { font-family: Arial; margin:0; background:#f5f5f5; }

        .navbar {
            background:#1a7a7a; color:white;
            padding:14px 20px;
            display:flex; justify-content:space-between;
        }

        .main { padding:22px; }

        .card {
            background:white;
            border-radius:6px;
            padding:20px;
            max-width:550px;
            margin:auto;
        }

        input, select {
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:4px;
        }

        button {
            background:#1a7a7a;
            color:white;
            padding:10px;
            border:none;
            width:100%;
            border-radius:4px;
            cursor:pointer;
        }

        button:hover { background:#155f5f; }
    </style>
</head>
<body>

<div class="navbar">
    <h2>🏦 Create Account</h2>
    <a href="/home"><button>Back</button></a>
</div>

<div class="main">
    <div class="card">
        <h3>Create New Account</h3>

        <form method="POST">
            <input type="number" name="customer_id" placeholder="Customer ID" required>

            <input type="text" name="customer_name" placeholder="Customer Full Name" required>

            <input type="email" name="email" placeholder="Customer Email" required>

            <input type="tel" name="phone" placeholder="Phone Number" required>

            <input type="text" name="pan" placeholder="PAN Card Number">

            <input type="text" name="aadhaar" placeholder="Aadhaar Number">

            <select name="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <input type="date" name="dob">

            <textarea name="address" placeholder="Customer Address" style="width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:4px;height:70px;"></textarea>


            <select name="account_type">
                <option value="savings">Savings</option>
                <option value="current">Current</option>
                <option value="fd">Fixed Deposit</option>
                <option value="rd">Recurring Deposit</option>
            </select>

            <select name="kyc_status">
                <option value="pending">KYC Pending</option>
                <option value="verified">KYC Verified</option>
            </select>

            <select name="nominee">
                <option value="yes">Nominee Added</option>
                <option value="no">No Nominee</option>
            </select>

            <input type="number" step="0.01" name="initial_deposit" placeholder="Initial Funding (₹)" value="0">

            <p style="font-size:12px;color:gray;">Note: Initial deposit will be added to balance and recorded as a transaction.</p>

            <button type="submit">Create Account</button>
        </form>
    </div>
</div>

</body>
</html>
