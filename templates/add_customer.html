<!DOCTYPE html>
<html>
<head>
    <title>Add Customer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .main {
            padding: 22px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            max-width: 400px;
            margin: auto;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1a7a7a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #1a7a7a;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>➕ Add Customer</h2>
    <a href="/home"><button style="width:auto;padding:6px 12px;">Back</button></a>
</div>

<div class="main">
    <div class="card">
        <h3>Enter Customer Details</h3>

        <form method="POST">
            <input type="text" name="name" placeholder="Customer Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone Number" required>
            <input type="text" name="address" placeholder="Address" required>

            <button type="submit">Add Customer</button>
        </form>
    </div>
</div>

</body>
</html>
