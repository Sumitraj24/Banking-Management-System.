<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 20px;
        }

        h2 {
            color: #1a7a7a;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1a7a7a;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .btn {
            padding: 6px 12px;
            background: #1a7a7a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Employee Management</h2>
    <a href="/home"><button class="btn">Back</button></a>
</div>

<div class="container">

    <h2>All Employees</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Emp ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Branch</th>
            <th>Role</th>
        </tr>

        {% for e in data %}
        <tr>
            <td>{{ e.id }}</td>
            <td>{{ e.emp_id }}</td>
            <td>{{ e.name }}</td>
            <td>{{ e.email }}</td>
            <td>{{ e.branch_id }}</td>
            <td>{{ e.role }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
