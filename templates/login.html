<!DOCTYPE html>
<html>
<head>
    <title>Employee Login</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #1a7a7a, #0f5c61);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        width: 380px;
        background: white;
        padding: 35px 30px;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        text-align: center;
    }

    .logo {
        font-size: 28px;
        margin-bottom: 5px;
    }

    h2 {
        margin: 0;
        color: #1a7a7a;
    }

    .subtitle {
        font-size: 13px;
        color: #777;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
        transition: 0.2s;
    }

    input:focus {
        outline: none;
        border-color: #1a7a7a;
        box-shadow: 0 0 5px rgba(26,122,122,0.3);
    }

    button {
        width: 100%;
        padding: 12px;
        background: #1a7a7a;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    button:hover {
        background: #155f5f;
    }

    .links {
        margin-top: 15px;
        font-size: 13px;
    }

    .links a {
        color: #1a7a7a;
        text-decoration: none;
        margin: 0 5px;
    }

    .links a:hover {
        text-decoration: underline;
    }

    /* Error message if login fails */
    .error {
        background-color: #ffe0e0;
        color: #cc0000;
        border: 1px solid #ffb3b3;
        padding: 8px 12px;
        border-radius: 5px;
        font-size: 13px;
        margin-bottom: 15px;
    }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🏦</div>
    <h2>Employee Login</h2>
    <div class="subtitle">Secure Banking Access</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="emp_id" placeholder="Employee ID" required>
        <input type="password" name="MPIN" placeholder="MPIN" required>
        <button type="submit">Login</button>
    </form>

    <button type="button" onclick="fingerLogin()" style="margin-top:10px;">
        🔐 Login with Fingerprint
    </button>

    <div class="links">
        <a href="#">Forgot MPIN?</a> |
        <a href="/register">Create Account</a>
    </div>
</div>

</body>
<script>
function fingerLogin() {
    alert("🔍 Scanning fingerprint...");

    setTimeout(() => {
        fetch("/fingerprint_login", {
            method: "POST"
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = "/home";
            } else {
                alert("Fingerprint login failed");
            }
        });
    }, 1200);
}
</script>
</html>
