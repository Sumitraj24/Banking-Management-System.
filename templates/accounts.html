<!DOCTYPE html>
<html>
<head>
    <title>Accounts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .main {
            padding: 22px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #1a7a7a;
            padding-bottom: 5px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1a7a7a;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn {
            padding: 6px 12px;
            background-color: #1a7a7a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #155f5f;
        }

        .freeze {
            background-color: #cc0000;
        }

        .freeze:hover {
            background-color: #990000;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>💳 Accounts</h2>
    <a href="/home"><button class="btn">Back</button></a>
</div>

<div class="main">

    <div class="section-title">All Accounts</div>

    <table>
        <tr>
            <th>Account ID</th>
            <th>Customer ID</th>
            <th>Customer Name</th>
            <th>Type</th>
            <th>Balance</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for a in data %}
        <tr>
            <td>{{ a.account_id }}</td>
            <td>{{ a.customer_id }}</td>
            <td>{{ a.customer.name }}</td>
            <td>{{ a.account_type }}</td>
            <td>₹{{ a.balance }}</td>
            <td>{{ a.status }}</td>
            <td>
                {% if a.status != "frozen" %}
                <a href="/freeze/{{ a.account_id }}">
                    <button class="btn freeze">Freeze</button>
                </a>
                {% else %}
                <a href="/unfreeze/{{ a.account_id }}">
                    <button class="btn">Unfreeze</button>
                </a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
