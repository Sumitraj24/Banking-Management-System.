<!DOCTYPE html>
<html>
<head>
    <title>Fraud Alerts</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 20px;
        }

        h2 {
            color: #1a7a7a;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1a7a7a;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .high {
            background-color: #ffe5e5;
            color: red;
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            background: #1a7a7a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Fraud Alerts</h2>
    <a href="/home"><button class="btn">Back</button></a>
</div>

<div class="container">

    <h2>Suspicious Transactions</h2>

    <table>
        <tr>
            <th>Fraud ID</th>
            <th>Transaction ID</th>
            <th>Customer Name</th>
            <th>Risk Level</th>
            <th>Reason</th>
            <th>Action</th>
        </tr>

        {% for f, name in alerts %}
        <tr class="{% if f.risk_level == 'high' %}high{% endif %}">
            <td>{{ f.fraud_id }}</td>
            <td>{{ f.transaction_id }}</td>
            <td>{{ name }}</td>
            <td>{{ f.risk_level }}</td>
            <td>{{ f.reason }}</td>
            <td>
                <form method="POST" action="/approve_transaction" style="display:inline;">
                    <input type="hidden" name="transaction_id" value="{{ f.transaction_id }}">
                    <button class="btn" style="background:green;">Approve</button>
                </form>

                <form method="POST" action="/cancel_transaction" style="display:inline;">
                    <input type="hidden" name="transaction_id" value="{{ f.transaction_id }}">
                    <button class="btn" style="background:red;">Cancel</button>
                </form>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
