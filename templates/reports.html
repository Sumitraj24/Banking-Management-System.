<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #1a7a7a;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 20px;
        }

        h2 {
            color: #1a7a7a;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .card p {
            font-size: 28px;
            color: #1a7a7a;
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            background: #1a7a7a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #155f5f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Reports & Analytics</h2>
    <a href="/home"><button class="btn">Back</button></a>
</div>

<div class="container">

    <h2>System Overview</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Customers</h3>
            <p>{{ c }}</p>
        </div>

        <div class="card">
            <h3>Total Accounts</h3>
            <p>{{ a }}</p>
        </div>

        <div class="card">
            <h3>Total Transactions</h3>
            <p>₹ {{ total_txn_amount }}</p>
        </div>

        <div class="card">
            <h3>Bank Balance</h3>
            <p>₹ {{ total_bank_balance }}</p>
        </div>

    </div>

</div>

</body>
</html>
