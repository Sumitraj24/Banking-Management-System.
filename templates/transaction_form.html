<!DOCTYPE html>
<html>
<head>
    <title>Transaction</title>
    <style>
        body { font-family: Arial; margin:0; background:#f5f5f5; }

        .navbar {
            background:#1a7a7a; color:white;
            padding:14px 20px;
            display:flex; justify-content:space-between;
        }

        .main { padding:22px; }

        .card {
            background:white;
            border-radius:6px;
            padding:20px;
            max-width:400px;
            margin:auto;
        }

        input, select {
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:4px;
        }

        button {
            background:#1a7a7a;
            color:white;
            padding:10px;
            border:none;
            width:100%;
            border-radius:4px;
            cursor:pointer;
        }

        button:hover { background:#155f5f; }
    </style>
</head>
<body>

<div class="navbar">
    <h2>💳 Transaction</h2>
    <a href="/home"><button>Back</button></a>
</div>

<div class="main">
    <div class="card">
        <h3>Make Transaction</h3>

        <form method="POST">
            <input type="number" name="account_id" placeholder="Account ID" required>
            <input type="number" name="amount" placeholder="Amount" required>

            <select name="type">
                <option value="deposit">Deposit</option>
                <option value="withdraw">Withdraw</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>
</div>

</body>
</html>
